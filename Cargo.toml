[package]
name = "actionc"
version = "0.1.0"
edition = "2024"
description = "Experimental cross-compiler scaffold for the Atari 8-bit Action! language"
license = "GPL-3.0-or-later"
default-run = "actionc"

[features]
native65816-state-proof = []

[dependencies]
atrcopy-rs = { path = "crates/atrcopy-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
