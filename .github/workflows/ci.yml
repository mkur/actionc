name: Cross-platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Rust toolchain
        run: rustc --version --verbose

      - name: Test workspace
        run: cargo test --locked

      - name: Test latent named modules
        run: cargo test --locked --features experimental-named-modules --test actionc_cli --test embedded_modules

      - name: Test VM runtime contracts
        working-directory: tools/vm-runtime-tests
        run: cargo test --locked

      - name: Test nightly tooling
        run: python -m unittest discover -s tools/tests -p "test_*.py"
